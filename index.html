<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinAdvisor | Value - Education - Opportunity</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

    <header>
        <div class="blue_bg-wrap">
            <div class="container">
                <div class="blue_bg-inner">

                    <a class="header_number" href="#"> <i class="bi bi-telephone"></i> (877) 540-2646</a>

                    <figure>
                        <picture>
                            <img src="assets/imgs/cards-icons.png" width="400" height="84" alt="Cards Logos">
                        </picture>
                        <figcaption>
                            <span>FREE SHIPPING ON ALL ORDERS!</span>
                        </figcaption>
                    </figure>

                    <section class="account_cart">
                        <a href="#">
                            <p>Account <i class="bi bi-chevron-down"></i></p>
                        </a>
                        <a href="#"><i class="bi bi-cart2"></i></a>
                    </section>

                </div>
            </div>
        </div> <!--Blue BG Wrap-->

        <div class="main_header-wrap">
            <div class="container">
                <div class="main_header-inner">

                    <picture>
                        <img src="assets/imgs/website-logo.png" width="321" height="122" alt="Website Logo">
                    </picture>

                    <div class="search_box-wrap">
                        <input class="search_bar" type="search" placeholder="Type here to search...">
                        <button class="srch_btn"><i class="bi bi-search"></i></button>
                    </div>

                    <picture class="auth_by-cmps">
                        <img src="assets/imgs/authorized.png" width="307" height="86" alt="Trusted By these companies">
                    </picture>

                </div>
            </div>
        </div> <!--Main Header Wrap-->

        <div class="navbar_wrap">
            <div class="container">
                <div class="navbar_inner-wrap">
                    <nav>

                        <button class="nav_toggle" id="navToggleBtn"><i class="bi bi-list"></i></button>

                        <div class="search_box-wrap-nav">
                        <input class="search_bar-nav" type="search" placeholder="Type here to search...">
                        <button class="srch_btn"><i class="bi bi-search"></i></button>
                        </div>


                        <ul id="navMenu">
                            <li><a href="#"><strong>FEATURED <i class="bi bi-chevron-down"></i></strong></a></li>
                            <li><a href="#"><strong>U.S MINT <i class="bi bi-chevron-down"></i></strong></a></li>
                            <li><a href="#"><strong>WORLD COINS <i class="bi bi-chevron-down"></i></strong></a></li>
                            <li><a href="#"><strong>ANCIENT COINS</strong></a></li>
                            <li><a href="#"><strong>SILVER COINS</strong></a></li>
                            <li><a href="#"><strong>GOLD COINS</strong></a></li>
                            <li><a href="#"><strong>COIN FINDER</strong></a></li>
                            <li><a href="#"><strong>OUR TEAM</strong></a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div> <!--Navbar Wrap-->
    </header>

    <main>
        <div class="info_card-wrap">
            <div class="container">
                <section class="check_out-info-wrap">
                    <div class="info_inner-wrap">

                        <div class="info_form">
                            <label for="emailAddress">Email Address</label>
                            <input class="t_box" type="email" id="emailAddress" placeholder="youremail@example.com"
                                required>
                        </div>

                        <h2 class="form_txt">Contact and Shipping Information:</h2>

                        <div class="pos_row">
                            <div class="info_form">
                                <label for="fName">First Name</label>
                                <input class="t_box" type="text" id="fName" placeholder="Muhammad" required>
                            </div>
                            <div class="info_form">
                                <label for="l">Last Name</label>
                                <input class="t_box" type="text" id="lName" placeholder="Ittihaf" required>
                            </div>
                        </div>

                        <div class="info_form">
                            <label for="Address">Address</label>
                            <input class="t_box" type="address" id="Address" placeholder="Address" required>
                        </div>

                        <div class="pos_row">
                            <div class="info_form">
                                <label for="aptSuite">Apt/Suite/Other (Optional)</label>
                                <input class="t_box" type="text" id="aptSuite">
                            </div>
                            <div class="info_form">
                                <label for="companyName">Company</label>
                                <input class="t_box" type="text" id="companyName">
                            </div>
                        </div>

                        <div class="pos_row">
                            <div class="info_form">
                                <label for="city">City</label>
                                <input class="t_box" type="text" id="city" placeholder="Enter City" required>
                            </div>
                            <div class="info_form">
                                <label for="state">Company</label>
                                <select name="State" id="state" placeholder="State">
                                    <option>Choose a state</option>
                                    <option>abc</option>
                                    <option>xyz</option>
                                </select>
                            </div>
                            <div class="info_form">
                                <label for="zip">Zip</label>
                                <input class="t_box" type="text" id="zip" placeholder="0000" required>
                            </div>
                        </div>

                        <div class="pos_row">
                            <div class="info_form">
                                <label for="number">Phone Number</label>
                                <input class="t_box" type="text" id="number" placeholder="(000) 000 000" required>
                            </div>
                            <div class="info_form">
                                <label for="extOpt">Extention (Optional)</label>
                                <input class="t_box" type="text" id="extOpt" placeholder="Ext: 0123">
                            </div>
                            <div class="info_form">
                                <button class="form_btn">Validate Address</button>
                            </div>
                        </div>

                    </div> <!--Information And shipping wrap-->

                    <div class="cart_summary-card">
                        <div class="cart_sum-card-inner">
                            <h3 class="cart_sum-txt">Cart Summary</h3>

                            <div class="summary_row">
                                <span>Subtotal:</span>
                                <span>$1,111.11</span>
                            </div>

                            <div class="summary_row">
                                <span>Discount:</span>
                                <span>$0.00</span>
                            </div>

                            <div class="summary_row">
                                <span>Shipping (USPS - Free)</span>
                                <span>$0.00</span>
                            </div>

                            <div class="summary_row b_brdr">
                                <span>Tax</span>
                                <span>$0.00</span>
                            </div>

                             <div class="summary_row">
                                <h4 class="total">Order Total</h4>
                                <h2 class="amount">$1,111.11</h2>
                            </div>

                            <div class="check_btn">
                                <input type="checkbox" id="check">
                                <label for="check"><span class="check_btn-txt">Get Shipping Alerts and Product Release Notifications Sent Directly To Your Phone. OPT-out Anytime. Standard Messaging Rates May Apply.</span></label>
                            </div>

                          <!-- <a class="form_btn" href="#">Modify Your Cart</a> -->
                        <div class="info_form cart_btn">
                          <button class="form_btn ">Modify Your Cart</button>
                        </div>

                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>


     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/main.js"></script>

</body>

</html>
